name: E2E Debug

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Gherkin tag to filter tests (e.g. @P0, @smoke, @noauth)'
        required: true
        type: string
        default: '@P0'
      trace:
        description: 'Trace capture mode'
        required: true
        type: choice
        options:
          - 'on'
          - 'retain-on-failure'
        default: 'on'
      video:
        description: 'Video capture mode'
        required: true
        type: choice
        options:
          - 'on'
          - 'retain-on-failure'
          - 'off'
        default: 'retain-on-failure'

permissions:
  contents: read

jobs:
  debug:
    name: Run Filtered E2E Tests (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (filtered)
        env:
          GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME }}
          GITHUB_PASSWORD: ${{ secrets.GITHUB_PASSWORD }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_API_TOKEN }}
          GITHUB_TEST_REPO: ${{ secrets.GITHUB_TEST_REPO }}
          GITHUB_TEST_REPO_OWNER: ${{ secrets.GITHUB_TEST_REPO_OWNER }}
          GITHUB_TEST_REPO_NAME: ${{ secrets.GITHUB_TEST_REPO_NAME }}
          GITHUB_PROJECT_SANDBOX: ${{ secrets.GITHUB_PROJECT_SANDBOX }}
          GITHUB_PROJECT_SANDBOX_NUMBER: ${{ secrets.GITHUB_PROJECT_SANDBOX_NUMBER }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BASE_URL: https://github.com
          TEST_MODE: full
        run: npm test -- --grep "${{ inputs.tag }}" --trace "${{ inputs.trace }}" --video "${{ inputs.video }}"

      - name: Generate Allure Report
        if: always()
        run: npx allure generate reports/allure/results --clean -o reports/allure/report || true

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-debug
          path: reports/playwright/
          retention-days: 7

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-debug
          path: reports/allure/report/
          retention-days: 7

      - name: Upload Test Results (Traces/Videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-debug
          path: reports/artifacts/
          retention-days: 7
