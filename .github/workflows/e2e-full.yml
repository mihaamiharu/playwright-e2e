name: E2E Full Suite

on:
  schedule:
    # 8 AM Indonesia Western Time (WIB) = 1 AM UTC every Sunday
    - cron: '0 1 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: e2e-full-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Restore previous run results (rerun only)
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV=$(( ${{ github.run_attempt }} - 1 ))
          echo "Attempting to restore results from attempt #$PREV"
          gh run download "${{ github.run_id }}" \
            --name "test-cache-${PREV}" \
            --dir ./prev-cache || echo "gh run download failed (exit $?)"
          echo "=== prev-cache file tree ==="
          find ./prev-cache -type f 2>/dev/null | head -20 || echo "(empty)"
          LAST_RUN=$(find ./prev-cache -name '.last-run.json' -type f 2>/dev/null | head -1)
          if [ -n "$LAST_RUN" ]; then
            echo "Found .last-run.json at: $LAST_RUN"
            mkdir -p reports/artifacts reports/allure/results
            cp "$LAST_RUN" reports/artifacts/.last-run.json
            ALLURE_DIR="$(dirname "$(dirname "$LAST_RUN")")/allure/results"
            if [ -d "$ALLURE_DIR" ]; then
              cp -r "$ALLURE_DIR"/. reports/allure/results/ 2>/dev/null || true
              echo "Copied Allure results from $ALLURE_DIR"
            fi
            echo "Restored previous results successfully"
            ls -la reports/artifacts/.last-run.json
          else
            echo "No .last-run.json found in cache, will run full suite"
          fi

      - name: Restore Allure History Cache
        uses: actions/cache/restore@v4
        with:
          path: reports/allure/history
          key: allure-history-${{ github.ref_name }}

      - name: Restore auth state (rerun only)
        if: github.run_attempt > 1
        uses: actions/cache/restore@v4
        with:
          path: auth/github.json.enc
          key: auth-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            auth-state-${{ github.run_id }}-

      - name: Decrypt auth state (rerun only)
        if: github.run_attempt > 1
        env:
          AUTH_CACHE_KEY: ${{ secrets.GH_API_TOKEN }}
        run: |
          if [ -f auth/github.json.enc ]; then
            mkdir -p auth
            openssl enc -aes-256-cbc -pbkdf2 -d \
              -in auth/github.json.enc \
              -out auth/github.json \
              -pass env:AUTH_CACHE_KEY
            echo "✅ Restored auth state from previous attempt"
          else
            echo "⚠️  No encrypted auth state found — will re-authenticate"
          fi

      - name: Run Playwright tests
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_PASSWORD: ${{ secrets.GH_PASSWORD }}
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          GH_TEST_REPO: ${{ secrets.GH_TEST_REPO }}
          GH_TEST_REPO_OWNER: ${{ secrets.GH_TEST_REPO_OWNER }}
          GH_TEST_REPO_NAME: ${{ secrets.GH_TEST_REPO_NAME }}
          GH_PROJECT_SANDBOX: ${{ secrets.GH_PROJECT_SANDBOX }}
          GH_PROJECT_SANDBOX_NUMBER: ${{ secrets.GH_PROJECT_SANDBOX_NUMBER }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BASE_URL: https://github.com
          TEST_MODE: full
        run: |
          npm run bddgen
          if [[ "${{ github.run_attempt }}" -gt 1 && -f reports/artifacts/.last-run.json ]]; then
            FAILED_COUNT=$(jq '.failedTests | length' reports/artifacts/.last-run.json 2>/dev/null || echo 0)
            if [[ "$FAILED_COUNT" -eq 0 ]]; then
              echo "→ No failures in previous run, running full suite"
              npx playwright test --config=playwright.bdd.config.ts --grep-invert @visual
            else
              echo "→ Rerun mode: $FAILED_COUNT previously failed tests"
              npx playwright test --config=playwright.bdd.config.ts --last-failed --grep-invert @visual
            fi
          else
            echo "→ Full mode: running all tests"
            npx playwright test --config=playwright.bdd.config.ts --grep-invert @visual
          fi

      - name: Sanitize traces (strip PAT from artifacts)
        if: always()
        run: npx tsx scripts/strip-trace-secrets.ts reports/allure/results reports/artifacts

      - name: Encrypt auth state for reruns
        if: always()
        env:
          AUTH_CACHE_KEY: ${{ secrets.GH_API_TOKEN }}
        run: |
          if [ -f auth/github.json ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -in auth/github.json \
              -out auth/github.json.enc \
              -pass env:AUTH_CACHE_KEY
            echo "🔐 Auth state encrypted for rerun cache"
          else
            echo "ℹ️  No auth state to cache"
          fi

      - name: Save auth cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: auth/github.json.enc
          key: auth-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload test run cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-cache-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            reports/artifacts/.last-run.json
            reports/allure/results/
          retention-days: 7

      - name: Copy Allure History to Results
        if: always()
        run: |
          if [ -d "reports/allure/history" ] && [ "$(ls -A reports/allure/history 2>/dev/null)" ]; then
            mkdir -p reports/allure/results/history
            cp -r reports/allure/history/* reports/allure/results/history/
          fi

      - name: Copy Allure Categories
        if: always()
        run: cp allure-categories.json reports/allure/results/categories.json 2>/dev/null || true

      - name: Write Step Summary
        if: always()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ALLURE_URL="https://mihaamiharu.github.io/playwright-e2e/"

          if [ -d "reports/allure/results" ] && [ "$(ls -A reports/allure/results/*-result.json 2>/dev/null)" ]; then
            STATS=$(find reports/allure/results -name '*-result.json' -exec cat {} + 2>/dev/null | jq -s 'group_by(.status) | map({key: .[0].status, value: length}) | from_entries')
            PASSED=$(echo "$STATS" | jq -r '.passed // 0')
            FAILED=$(echo "$STATS" | jq -r '.failed // 0')
            BROKEN=$(echo "$STATS" | jq -r '.broken // 0')
            SKIPPED=$(echo "$STATS" | jq -r '.skipped // 0')
            TOTAL=$((PASSED + FAILED + BROKEN + SKIPPED))
          else
            PASSED=0; FAILED=0; BROKEN=0; SKIPPED=0; TOTAL=0
          fi

          {
            echo "## 🧪 E2E Test Results"
            echo ""
            echo "| Status | Count |"
            echo "|--------|------:|"
            echo "| ✅ Passed  | $PASSED |"
            echo "| ❌ Failed  | $FAILED |"
            echo "| 💥 Broken  | $BROKEN |"
            echo "| ⬜ Skipped | $SKIPPED |"
            if [ "$TOTAL" -gt 0 ]; then
              echo "| **Total** | **$TOTAL** |"
            fi
            echo ""
            echo "### Reports"
            echo "- 📊 [Allure Report (history + trends)]($ALLURE_URL)"
            echo "- 🎭 [Playwright HTML Report]($RUN_URL#artifacts)"
            if [ "$FAILED" -gt 0 ] || [ "$BROKEN" -gt 0 ]; then
              echo ""
              echo "> 💡 Traces and screenshots are attached to each failed test in the Allure report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Debug Allure History
        if: always()
        run: |
          echo "=== History dir ==="
          ls -la reports/allure/results/history/ 2>/dev/null || echo "No history dir"

      - name: Generate Allure Report
        if: always()
        run: npx allure generate -o reports/allure/report reports/allure/results || true

      - name: Update Allure History for Cache
        if: always()
        run: |
          mkdir -p reports/allure/history
          if [ -d "reports/allure/report/history" ]; then
            cp -r reports/allure/report/history/* reports/allure/history/
          fi

      - name: Save Allure History Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: reports/allure/history
          key: allure-history-${{ github.ref_name }}

      - name: Deploy Allure Report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports/allure/report
          publish_branch: gh-pages
          enable_jekyll: false
          force_orphan: true

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/playwright/
          retention-days: 7

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure/report/
          retention-days: 7

      - name: Upload Test Results (Traces/Videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/artifacts/
          retention-days: 7
