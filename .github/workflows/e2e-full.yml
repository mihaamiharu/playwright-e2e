name: E2E Full Suite

on:
  schedule:
    # 8 AM Indonesia Western Time (WIB) = 1 AM UTC every Sunday
    - cron: '0 1 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_PASSWORD: ${{ secrets.GH_PASSWORD }}
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          GH_TEST_REPO: ${{ secrets.GH_TEST_REPO }}
          GH_TEST_REPO_OWNER: ${{ secrets.GH_TEST_REPO_OWNER }}
          GH_TEST_REPO_NAME: ${{ secrets.GH_TEST_REPO_NAME }}
          GH_PROJECT_SANDBOX: ${{ secrets.GH_PROJECT_SANDBOX }}
          GH_PROJECT_SANDBOX_NUMBER: ${{ secrets.GH_PROJECT_SANDBOX_NUMBER }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BASE_URL: https://github.com
          TEST_MODE: full
          NODE_OPTIONS: --use-system-ca
        run: npm run bddgen && npx playwright test --config=playwright.bdd.config.ts --grep-invert @visual

      - name: Restore Allure History Cache
        uses: actions/cache/restore@v4
        with:
          path: reports/allure/history
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            allure-history-${{ github.ref_name }}-
            allure-history-

      - name: Copy Allure History to Results
        if: always()
        run: |
          if [ -d "reports/allure/history" ]; then
            mkdir -p reports/allure/results/history
            cp -r reports/allure/history/* reports/allure/results/history/
          fi

      - name: Generate Allure Report
        if: always()
        run: npx allure generate -o reports/allure/report reports/allure/results || true

      - name: Update Allure History for Cache
        if: always()
        run: |
          if [ -d "reports/allure/report/history" ]; then
            mkdir -p reports/allure/history
            cp -r reports/allure/report/history/* reports/allure/history/
          fi

      - name: Save Allure History Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: reports/allure/history
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}

      - name: Deploy Allure Report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports/allure/report
          publish_branch: gh-pages
          enable_jekyll: false
          force_orphan: true

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/playwright/
          retention-days: 7

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure/report/
          retention-days: 7

      - name: Upload Test Results (Traces/Videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/artifacts/
          retention-days: 7
