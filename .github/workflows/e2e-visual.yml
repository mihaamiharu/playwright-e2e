name: E2E Visual Regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_PASSWORD: ${{ secrets.GH_PASSWORD }}
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          GH_TEST_REPO: ${{ secrets.GH_TEST_REPO }}
          GH_TEST_REPO_OWNER: ${{ secrets.GH_TEST_REPO_OWNER }}
          GH_TEST_REPO_NAME: ${{ secrets.GH_TEST_REPO_NAME }}
          GH_PROJECT_SANDBOX: ${{ secrets.GH_PROJECT_SANDBOX }}
          GH_PROJECT_SANDBOX_NUMBER: ${{ secrets.GH_PROJECT_SANDBOX_NUMBER }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BASE_URL: https://github.com
          TEST_MODE: full
        run: npm run bddgen && npx playwright test --config=playwright.bdd.config.ts --grep @visual

      - name: Generate Allure Report
        if: always()
        run: npx allure generate reports/allure/results --clean -o reports/allure/report || true

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-html-report
          path: reports/playwright/
          retention-days: 7

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-allure-report
          path: reports/allure/report/
          retention-days: 7

      - name: Upload Visual Diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            reports/artifacts/**/*-actual.png
            reports/artifacts/**/*-diff.png
          retention-days: 7

      - name: Upload Test Results (Traces/Videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results
          path: reports/artifacts/
          retention-days: 7
